services:
  postgres:
    image: postgres:17-alpine
    container_name: giayda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-production_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Không có giá trị mặc định: mật khẩu luôn đến từ .env (xem .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt — tạo file .env từ .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-production_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
